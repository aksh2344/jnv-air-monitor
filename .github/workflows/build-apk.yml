name: Build Ad-Free APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android APK
        run: |
          cordova create app com.jnvbijnor.jnvaqi "JNV AQI"
          rm -rf app/www/*
          cp index.html style.css script.js jnv_logo.png app/www/ 2>/dev/null || cp index.html style.css script.js app/www/ 2>/dev/null || true
          cd app
          cordova platform add android
          cordova build android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNV-AQI-Clean-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
